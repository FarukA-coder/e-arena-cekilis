<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Arena Çekilişine Katıl | Mobil Kayıt</title>
  <meta name="description" content="E-Arena ve Teknoloji Topluluğu Canlı Etkinlik Çekiliş Formu">
  
  <link rel="icon" type="image/jpeg" href="sunum logo.jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-wrapper">
    <div class="mobile-card">
      
      <!-- Logo Rozeti -->
      <div class="mobile-logo-wrapper">
        <img src="sunum logo.jpeg" alt="E-Arena Logo">
      </div>

      <h1 class="mobile-title">E-Arena Çekiliş</h1>
      <p class="mobile-subtitle">Canlı etkinlik çekiliş çarkına katılmak için bilgilerini gir.</p>

      <!-- Kayıtlar Kapalı Uyarı Banner'ı -->
      <div id="closedBanner" class="alert-toast warning" style="display: none;">
        🔒 Çekiliş kayıtları geçici olarak durdurulmuştur.
      </div>

      <!-- Bildirim Mesajı (Hata / Başarı) -->
      <div id="alertBox" class="alert-toast"></div>

      <!-- Katılım Formu -->
      <form id="joinForm" class="mobile-form">
        <div class="form-group">
          <label for="nameInput" class="form-label">Ad Soyad</label>
          <input 
            type="text" 
            id="nameInput" 
            class="form-input" 
            placeholder="Örn: Ahmet Yılmaz" 
            required 
            autocomplete="name"
            maxlength="40"
          >
        </div>

        <div class="form-group">
          <label for="studentIdInput" class="form-label">Öğrenci Numarası (9 Haneli)</label>
          <input 
            type="text" 
            id="studentIdInput" 
            class="form-input" 
            placeholder="Örn: 220101001" 
            required 
            maxlength="9"
            minlength="9"
            pattern="\d{9}"
            inputmode="numeric"
            autocomplete="off"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Kayıt Ol ve Katıl 🚀
        </button>
      </form>

      <!-- Başarılı Katılım Bilet Kartı -->
      <div id="ticketSuccess" class="ticket-success" style="display: none;">
        <div class="ticket-icon">✓</div>
        
        <h2 style="font-family: var(--font-heading); font-size: 1.25rem; color: #ffffff;">
          Çekilişe Katıldınız!
        </h2>
        <p style="font-size: 0.85rem; color: var(--silver-muted); margin-top: -0.5rem;">
          İsminiz sahnedeki çarka eklendi. Gözünüz ana ekranda olsun!
        </p>

        <div class="ticket-details">
          <div class="detail-row">
            <span class="detail-label">Katılımcı:</span>
            <span class="detail-value" id="ticketName">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Öğrenci No:</span>
            <span class="detail-value" id="ticketId">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Durum:</span>
            <span class="detail-value" style="color: #4ade80;">Aktif Katılımcı 🎯</span>
          </div>
        </div>

        <button type="button" id="reRegisterBtn" class="btn-secondary" style="margin-top: 0.8rem; font-size: 0.8rem;">
          Başka Bir Kişi Kaydet
        </button>
      </div>

    </div>
  </div>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const socket = io();

      const joinForm = document.getElementById('joinForm');
      const nameInput = document.getElementById('nameInput');
      const studentIdInput = document.getElementById('studentIdInput');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      const closedBanner = document.getElementById('closedBanner');

      const ticketSuccess = document.getElementById('ticketSuccess');
      const ticketName = document.getElementById('ticketName');
      const ticketId = document.getElementById('ticketId');
      const reRegisterBtn = document.getElementById('reRegisterBtn');

      let isRegistrationOpen = true;

      // Öğrenci numarası girişini sadece rakam ve en fazla 9 hane ile sınırla
      studentIdInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 9);
      });

      function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = `alert-toast ${isError ? 'error' : 'success'}`;
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      function updateRegistrationState(isOpen) {
        isRegistrationOpen = Boolean(isOpen);
        if (isRegistrationOpen) {
          closedBanner.style.display = 'none';
          nameInput.disabled = false;
          studentIdInput.disabled = false;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Kayıt Ol ve Katıl 🚀';
        } else {
          closedBanner.style.display = 'block';
          nameInput.disabled = true;
          studentIdInput.disabled = true;
          submitBtn.disabled = true;
          submitBtn.textContent = 'Kayıtlar Geçici Olarak Durduruldu 🔒';
        }
      }

      function showTicket(data) {
        joinForm.style.display = 'none';
        ticketSuccess.style.display = 'flex';
        ticketName.textContent = data.name;
        ticketId.textContent = data.studentId;
        hideAlert();
      }

      function showForm() {
        joinForm.style.display = 'flex';
        ticketSuccess.style.display = 'none';
        nameInput.value = '';
        studentIdInput.value = '';
        hideAlert();
        updateRegistrationState(isRegistrationOpen);
        if (isRegistrationOpen) {
          nameInput.focus();
        }
      }

      // Socket Bağlantı ve Durum Dinleyicileri
      socket.on('init_data', (data) => {
        if (data.registrationOpen !== undefined) {
          updateRegistrationState(data.registrationOpen);
        }
      });

      socket.on('registration_status_changed', (data) => {
        if (data.registrationOpen !== undefined) {
          updateRegistrationState(data.registrationOpen);
        }
      });

      // Daha önce katılmış mı kontrol et (LocalStorage)
      const savedUser = localStorage.getItem('earena_participant');
      if (savedUser) {
        try {
          const parsed = JSON.parse(savedUser);
          if (parsed && parsed.name) {
            showTicket(parsed);
          }
        } catch(e) {
          localStorage.removeItem('earena_participant');
        }
      }

      // Form Gönderme
      joinForm.addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlert();

        if (!isRegistrationOpen) {
          showAlert('Çekiliş kayıtları geçici olarak durdurulmuştur!');
          return;
        }

        const name = nameInput.value.trim();
        const studentId = studentIdInput.value.trim();

        if (!name || name.length < 2) {
          showAlert('Lütfen geçerli bir Ad Soyad giriniz (en az 2 karakter)!');
          nameInput.focus();
          return;
        }

        // 9 Haneli Öğrenci Numarası Doğrulaması
        const studentIdRegex = /^\d{9}$/;
        if (!studentIdRegex.test(studentId)) {
          showAlert('Öğrenci numarası tam olarak 9 basamaklı rakamlardan oluşmalıdır!');
          studentIdInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Kaydediliyor...';

        // Socket.io ile gönder
        socket.emit('join_draw', { name, studentId }, (response) => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Kayıt Ol ve Katıl 🚀';

          if (response && response.success) {
            const userData = { name, studentId, id: response.participant?.id };
            localStorage.setItem('earena_participant', JSON.stringify(userData));
            showTicket(userData);
          } else {
            showAlert(response?.message || 'Kayıt sırasında bir hata oluştu!');
          }
        });
      });

      // Farklı kişi kaydetmek istenirse
      reRegisterBtn.addEventListener('click', () => {
        localStorage.removeItem('earena_participant');
        showForm();
      });
    });
  </script>
</body>
</html>
